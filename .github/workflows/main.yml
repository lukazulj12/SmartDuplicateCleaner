name: Izgradi APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Testovi i izgradnja
        run: |
          echo "Sadržaj repozitorija:"
          find . -maxdepth 3 -not -path './.git*' | sort | head -60
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::U repozitoriju nije pronađena datoteka settings.gradle.kts – projekt nije uploadan."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          echo "Mapa projekta: $(pwd)"
          gradle :core:test :app:testDebugUnitTest assembleDebug --stacktrace

      - name: Preuzimanje APK-a
        uses: actions/upload-artifact@v4
        with:
          name: SmartDuplicateCleaner-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
