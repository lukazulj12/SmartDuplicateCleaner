name: Izgradi APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK je već instaliran na GitHubovom serveru.

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testovi i izgradnja
        run: |
          if [ -f SmartDuplicateCleaner/gradlew ]; then cd SmartDuplicateCleaner; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest assembleDebug --stacktrace

      - name: Preuzimanje APK-a
        uses: actions/upload-artifact@v4
        with:
          name: SmartDuplicateCleaner-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
