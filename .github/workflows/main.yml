name: Izgradi APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testovi i izgradnja
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest assembleDebug --stacktrace

      - name: Preuzimanje APK-a
        uses: actions/upload-artifact@v4
        with:
          name: SmartDuplicateCleaner-apk
          path: app/build/outputs/apk/debug/app-debug.apk
